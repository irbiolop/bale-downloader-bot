name: Keepalive

# گیت‌هاب cron های مخزن غیرفعال را بعد از ۶۰ روز بی‌فعالیتی خاموش می‌کند؛
# این ورک‌فلو هر هفته یک کامیت خالی می‌زند تا ربات «مادام‌العمر» بماند.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit
        run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "keepalive $(date -u '+%Y-%m-%d %H:%M')"
          git push
