name: Bale Toolbox Bot (24/7)

# اجرای همیشگی: هر اجرا تا ~۵.۶ ساعت دوام دارد و cron هر ۲۰ دقیقه
# در صورت نیاز دوباره اجرایش می‌آورد (بدون هم‌پوشانی، به لطف concurrency).
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

concurrency:
  group: bale-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # حفظ state.json (سشن تلگرام، توکن گیت‌هاب، کانال‌ها) بین اجراها
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: bale-state-${{ github.run_id }}
          restore-keys: bale-state-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python main.py
